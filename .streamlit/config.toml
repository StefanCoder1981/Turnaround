[theme]
font = "sans-serif"

# Helles Schema
[theme.light]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"

[theme.light.sidebar]
backgroundColor = "#f6f5f2"

# Dunkles Schema
[theme.dark]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#f0efec"
borderColor = "#383835"

[theme.dark.sidebar]
backgroundColor = "#121211"

[server]
headless = false

[browser]
gatherUsageStats = false
